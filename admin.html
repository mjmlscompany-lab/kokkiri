<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>象 콕끼리 통합 기록판</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f4f7f9; padding: 15px; }
        .header { background: #34495e; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 10px; font-weight: bold; }
        .court-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #3498db; }
        .match-row { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: bold; }
        .team-box { text-align: center; flex: 1; padding: 10px; border-radius: 10px; }
        .winner { background: #e8f8f5; color: #27ae60; border: 2px solid #27ae60; }
        .rank-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="header">象 콕끼리 실시간 전적판</div>
    <div id="container"></div>
    <h2 style="text-align:center;">🏆 현재 순위</h2>
    <table class="rank-table" id="rankBody"></table>

    <script>
        const DB_URL = "https://kvdb.io/jerry_kokkiri_2026/live_data";
        
        // 닉네임 수기 관리
        const playerMap = {
            1: "구구", 2: "단우", 3: "로토", 4: "구름", 5: "이름", 6: "백구",
            7: "새로", 8: "바유", 9: "슝슝이", 10: "쿠쿠", 11: "제리", 12: "후니",
            13: "현이", 14: "따순", 15: "라임", 16: "곽동칠", 17: "리버", 18: "우지",
            19: "동이", 20: "극선호", 21: "선호", 22: "아몬드", 23: "임시1", 24: "임시2"
        };

        async function update() {
            try {
                const res = await fetch(DB_URL);
                const data = await res.json();
                const container = document.getElementById('container');
                container.innerHTML = "";
                
                // 데이터 기반 경기 카드 렌더링
                data.schedule["1"].forEach((m, i) => {
                    const isWin0 = data.results[`1-${i+1}`] === 0;
                    const isWin1 = data.results[`1-${i+1}`] === 1;
                    container.innerHTML += `
                        <div class="court-card">
                            <div class="match-row">
                                <div class="team-box ${isWin0 ? 'winner' : ''}">${m.t0.map(n => playerMap[n]).join(' ')}</div>
                                <div>VS</div>
                                <div class="team-box ${isWin1 ? 'winner' : ''}">${m.t1.map(n => playerMap[n]).join(' ')}</div>
                            </div>
                        </div>`;
                });

                // 순위표
                const ranks = data.players.sort((a,b) => (b.wins-b.losses) - (a.wins-a.losses));
                document.getElementById('rankBody').innerHTML = `<tr><th>이름</th><th>승</th><th>패</th></tr>` + 
                    ranks.map(p => `<tr><td>${p.name}</td><td>${p.wins}</td><td>${p.losses}</td></tr>`).join('');
            } catch(e) {}
        }
        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
