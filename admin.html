<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐘 콕끼리 자율게임 </title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f4f7f9; padding: 20px; color: #2c3e50; }
        .court-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1000px; margin: 0 auto; }
        .court { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 2px solid transparent; transition: 0.3s; }
        .court.playing { border-color: #ff85a2; background: #fffdfd; }
        .title-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .title { font-weight: 800; font-size: 1.1rem; color: #27ae60; }
        .playing .title { color: #ff85a2; }
        .status-text { font-size: 0.8rem; font-weight: bold; color: #ff85a2; display: none; }
        .playing .status-text { display: block; }
        .player-input { width: 100%; padding: 10px; margin-bottom: 5px; border: 1px solid #eee; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn-box { display: flex; gap: 5px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .start-btn { background: #27ae60; color: white; }
        .end-btn { background: #ff85a2; color: white; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">🐘 콕끼리 자율게임</h2>
    <div id="courts-container" class="court-grid"></div>

    <script>
        const container = document.getElementById('courts-container');

        // 중복 방지: 이름 입력창에서 벗어날 때 체크
        function validateName(inputEl) {
            const val = inputEl.value.trim();
            if (!val) return;

            const allInputs = document.querySelectorAll('.player-input');
            let count = 0;
            allInputs.forEach(input => {
                if (input.value.trim() === val) count++;
            });

            if (count > 1) {
                alert(`"${val}"님은 이미 다른 코트에 등록되어 있습니다.`);
                inputEl.value = ''; // 중복이면 지움
                inputEl.focus();
            }
        }

        for(let i=1; i<=6; i++) {
            const div = document.createElement('div');
            div.className = 'court';
            div.id = `court-${i}`;
            div.innerHTML = `
                <div class="title-wrapper">
                    <div class="title">${i}번 코트</div>
                    <div class="status-text">▶ 게임 중</div>
                </div>
                ${[1,2,3,4].map(n => `<input type="text" class="player-input" onblur="validateName(this)" placeholder="이름 ${n}">`).join('')}
                <div class="btn-box">
                    <button class="start-btn" onclick="startGame(${i})">시작</button>
                    <button class="end-btn" onclick="endGame(${i})">종료</button>
                </div>
            `;
            container.appendChild(div);
        }

        function startGame(i) {
            document.getElementById(`court-${i}`).classList.add('playing');
        }

        function endGame(i) {
            if(!confirm(`${i}번 코트를 종료하고 다음 대기자들을 위로 올릴까요?`)) return;
            
            const currentCourt = document.getElementById(`court-${i}`);
            currentCourt.classList.remove('playing');
            
            for(let j = i; j < 6; j++) {
                const currInputs = document.getElementById(`court-${j}`).querySelectorAll('.player-input');
                const nextInputs = document.getElementById(`court-${j+1}`).querySelectorAll('.player-input');
                
                currInputs.forEach((input, idx) => input.value = nextInputs[idx].value);
                nextInputs.forEach(input => input.value = '');
                document.getElementById(`court-${j+1}`).classList.remove('playing');
            }
        }
    </script>
</body>
</html>
