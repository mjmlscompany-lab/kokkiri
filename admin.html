<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>👑 방장 전적 합산기</title>
</head>
<body style="padding:20px;">
    <h2>경기 승리팀 기록하기</h2>
    <div id="controls"></div>
    <button onclick="saveResult()" style="padding:15px; background:red; color:white; font-size:1.2rem; margin-top:20px;">최종 전적 합산하기</button>

    <script>
        const DB_URL = "https://kvdb.io/jerry_kokkiri_2026/live_data";
        
        async function saveResult() {
            // 1. 서버 데이터 가져오기
            const res = await fetch(DB_URL);
            let data = await res.json();
            
            // 2. 결과 합산 로직
            Object.keys(data.results).forEach(key => {
                const winIdx = data.results[key];
                const match = data.schedule["1"][key.split('-')[1]-1];
                
                match[`t${winIdx}`].forEach(pId => {
                    const player = data.players.find(p => p.name === playerMap[pId]);
                    if(player) player.wins++;
                });
                match[`t${winIdx==0?1:0}`].forEach(pId => {
                    const player = data.players.find(p => p.name === playerMap[pId]);
                    if(player) player.losses++;
                });
            });

            // 3. 서버에 결과 초기화 및 반영
            data.results = {};
            await fetch(DB_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("전적이 성공적으로 합산되었습니다!");
        }
    </script>
</body>
</html>
